environment:
  REDIS_URL: redis://redis:6379/0
rvm: true
services:
  redis:
    image: redis:5.0.7
    expose:
      - 6379
builds:
  ruby:
    name: Ruby and integration tests
    paths:
      - "**"
      - "!app/assets/config/**"
      - "!app/assets/javascripts/**"
      - "!spec/dummy/app/assets/javascripts/**"
      - "!spec/dummy/package.json"
    script:
      - RAILS_ENV=test bundle exec rake db:schema:load
      - xvfb-run bundle exec rspec
      - bundle exec rake best_practice_project:run
  javascript:
    name: JavaScript assets
    paths:
      - app/assets/config/**
      - app/assets/javascripts/**
      - spec/dummy/app/assets/javascripts/**
      - spec/dummy/package.json
      - config/**
      - spec/dummy/config/**
      - spec/dummy/db/**
      - spec/dummy/Rakefile
      - peak_flow.yml
      - Gemfile
      - Gemfile.lock
      - model_updates.gemspec
      - Rakefile
      - .ruby-version
      - .rspec
      - .rubocop.yml
      - .github/**
      - .gitignore
      - MIT-LICENSE
      - README.md
      - "**/*.lock"
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
    script:
      - RAILS_ENV=test bundle exec rake db:schema:load
      - xvfb-run bundle exec rspec
      - bundle exec rake best_practice_project:run
